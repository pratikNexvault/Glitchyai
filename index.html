/* ══════════════════════════════════════════
   SUPABASE STORAGE
   Har setting Supabase mein bhi save hogi
   Device change karo → login karo → sab wapas
══════════════════════════════════════════ */
async function supabaseSave(table, key, value) {
  const cfg = loadCfg();
  if(!cfg.supabaseUrl || !cfg.supabaseKey) return false;
  try {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/${table}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": cfg.supabaseKey,
        "Authorization": `Bearer ${cfg.supabaseKey}`,
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify({key, value: JSON.stringify(value)})
    });
    return r.ok;
  } catch { return false; }
}

async function supabaseLoad(table, key) {
  const cfg = loadCfg();
  if(!cfg.supabaseUrl || !cfg.supabaseKey) return null;
  try {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/${table}?key=eq.${key}&select=value`, {
      headers: {"apikey": cfg.supabaseKey, "Authorization": `Bearer ${cfg.supabaseKey}`}
    });
    const d = await r.json();
    if(d?.[0]?.value) return JSON.parse(d[0].value);
    return null;
  } catch { return null; }
}

function md(t) {

    .replace(/```mem_action\n?([\s\S]*?)```/g,(_,c)=>{ try{ const d=JSON.parse(c.trim()); addMem(d.text,d.type||"fact",d.imp||5); return `<div style="background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;color:var(--p)">🧠 <b>Remembered:</b> ${d.text}</div>`; }catch{return "";} })

    .replace(/^### (.+)$/gm,`<h3 style="font-size:15px;font-weight:600;color:var(--ink);margin:10px 0 4px">$1</h3>`)
    .replace(/^## (.+)$/gm,`<h2 style="font-size:17px;font-weight:700;color:var(--ink);margin:12px 0 5px">$1</h2>`)
    .replace(/^- (.+)$/gm,`<div style="display:flex;gap:7px;margin:3px 0"><span style="color:var(--g);font-weight:700;flex-shrink:0">•</span><span>$1</span></div>`)

/* ══ WEB RESEARCH ══ */
async function doResearch(q) {
  const res=[]; let ans="",abs="";
  try {
    const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`,{headers:{"User-Agent":"Lumis/2.0"}});
    const d=await r.json();
    ans=d.Answer||""; abs=d.Abstract||"";
    (d.RelatedTopics||[]).slice(0,5).forEach(t=>{if(t.Text&&t.FirstURL)res.push({title:t.Text.slice(0,80),url:t.FirstURL,snippet:t.Text,src:"DuckDuckGo"});});
    (d.Results||[]).slice(0,3).forEach(r=>{if(r.Text&&r.FirstURL)res.push({title:r.Text.slice(0,80),url:r.FirstURL,snippet:r.Text,src:"DuckDuckGo"});});
  } catch {}
  try {
    const w=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q.split(" ").slice(0,3).join("_"))}`,{headers:{"User-Agent":"Lumis/2.0"}});
    if(w.ok){const d=await w.json();if(d.extract?.length>50)res.unshift({title:d.title,url:d.content_urls?.desktop?.page||"#",snippet:d.extract.slice(0,300),src:"Wikipedia",thumb:d.thumbnail?.source});}
  } catch {}
  return {q,ans,abs,res};
}

  async function loadFromSupabase() {
    setSyncing(true);
    const remote = await supabaseLoad("lumis_settings","config");
    if(remote) { saveCfg(remote); setCfg(remote); setMsg("✅ Settings loaded from Supabase!"); }
    else setMsg("❌ Nothing found in Supabase — save first");
    setSyncing(false);
    setTimeout(()=>setMsg(""),3000);
  }

  async function testAPI() {
    setTestMsg("Testing…");
    // Use latest cfg including unsaved
    const key = (cfg.apiKey||"").trim();
    const base = (cfg.apiBase||"https://cc.freemodel.dev").replace(/\/+$/,"");
    const model = cfg.model||"claude-sonnet-4-6";
    if(!key){setTestMsg("❌ API key missing");setTimeout(()=>setTestMsg(""),3000);return;}
    try {
      const res = await fetch(`${base}/v1/messages`,{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model,max_tokens:30,messages:[{role:"user",content:"Say: connected"}]})
      });
      if(res.ok){const d=await res.json();setTestMsg("✅ "+d.content?.[0]?.text||"Connected!");}
      else{const e=await res.json().catch(()=>({}));setTestMsg("❌ Error "+res.status+": "+(e.error?.message||res.statusText));}
    } catch(e) {
      // Try via proxy
      try {
        const r2=await fetch(`https://corsproxy.io/?${encodeURIComponent(base+"/v1/messages")}`,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},body:JSON.stringify({model,max_tokens:30,messages:[{role:"user",content:"Say: connected"}]})});
        if(r2.ok){const d2=await r2.json();setTestMsg("✅ Connected via proxy!");}
        else setTestMsg("❌ Failed: "+e.message);
      } catch(e2){setTestMsg("❌ "+e2.message);}
    }
    setTimeout(()=>setTestMsg(""),5000);
  }

      </div>
      <div className="panel" style={{padding:14}}>

        {/* Security note */}
        <div style={{background:"rgba(37,99,235,.05)",border:"1px solid rgba(37,99,235,.15)",borderRadius:12,padding:14,marginBottom:14,fontSize:13,color:"var(--ink)",lineHeight:1.7}}>
          🔒 <b>Safe!</b> Keys browser mein save hoti hain. Supabase se sync karo toh device change hone par bhi milegi.
        </div>

        {/* Supabase Sync */}
        <div className="card" style={{padding:16,marginBottom:12}}>

          <Field label="SUPABASE URL" hint="supabase.com → New Project → Settings → API → Project URL">
            <input className="inp" value={cfg.supabaseUrl||""} onChange={e=>setCfg({...cfg,supabaseUrl:e.target.value})} placeholder="https://xxxxx.supabase.co"/>
          </Field>
          <Field label="SUPABASE ANON KEY" hint="Settings → API → Project API keys → anon key">
            <input className="inp" type="password" value={cfg.supabaseKey||""} onChange={e=>setCfg({...cfg,supabaseKey:e.target.value})} placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."/>
          </Field>
          {msg&&<div style={{fontSize:13,color:msg.startsWith("✅")?"var(--g)":"var(--r)",marginBottom:10}}>{msg}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={save} className="btn-g" style={{flex:1,justifyContent:"center",fontSize:13,padding:"9px"}}>
              {syncing?<Spin s={13} c="#fff"/>:saved?<><I n="check" s={13} c="#fff"/>Saved!</>:<><I n="cloud" s={13} c="#fff"/>Save & Sync</>}
            </button>
            <button onClick={loadFromSupabase} className="btn-b" disabled={!cfg.supabaseUrl||!cfg.supabaseKey} style={{flex:1,justifyContent:"center",fontSize:13,padding:"9px"}}>

function BotPanel({onBack}) {
  const [cfg,setCfg]=useState(()=>loadCfg());
  const [wRes,setWRes]=useState(""); const [loading,setLoading]=useState(false);

  async function setWebhook() {
    const tok = cfg.telegramToken||loadCfg().telegramToken;
    const bUrl = cfg.backendUrl||loadCfg().backendUrl;
    if(!tok){setWRes("❌ Bot token missing — Settings mein daalo");return;}
    setLoading(true);
    try {
      let webhookUrl;
      if(bUrl) {
        webhookUrl = bUrl.replace(/\/$/,"") + "/api/telegram/webhook";
      } else {
        // Self-hosted webhook via this same page's origin
        webhookUrl = window.location.origin + "/api/telegram/webhook";
      }
      const r=await fetch(`https://api.telegram.org/bot${tok}/setWebhook`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url:webhookUrl,allowed_updates:["message"]})
      });
      const d=await r.json();
      setWRes(d.ok?`✅ Webhook set!\n${webhookUrl}`:`❌ ${d.description}`);
    } catch(e){setWRes("❌ "+e.message);}
    setLoading(false);
  }

  async function testToken() {
    const tok = cfg.telegramToken||loadCfg().telegramToken;
    if(!tok){setWRes("❌ Token missing");return;}
    try{const r=await fetch(`https://api.telegram.org/bot${tok}/getMe`);const d=await r.json();setWRes(d.ok?`✅ Bot: @${d.result.username}`:"❌ Invalid token");}
    catch(e){setWRes("❌ "+e.message);}
  }

  async function sendTest() {
    const tok = cfg.telegramToken||loadCfg().telegramToken;
    const uid = cfg.telegramOwnerId||loadCfg().telegramOwnerId;
    if(!tok||!uid){setWRes("❌ Token aur User ID dono chahiye");return;}
    const r=await fetch(`https://api.telegram.org/bot${tok}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:uid,text:"🌿 Lumis AI test message! Bot is working ✅"})});
    const d=await r.json();
    setWRes(d.ok?"✅ Test message sent! Check your Telegram.":"❌ "+d.description);
  }

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div className="topbar"><button className="back" onClick={onBack}><I n="arrl" s={14} c="var(--g)"/> Home</button><span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"var(--ink)",flex:1}}>Telegram Bot</span></div>
      <div className="panel" style={{padding:14}}>

        {/* Bot hosting explanation */}
        <div style={{background:"rgba(58,125,92,.06)",border:"1px solid rgba(58,125,92,.2)",borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--g)",letterSpacing:"1px",marginBottom:8}}>ℹ️ BOT HOSTING — WEBSITE HI HANDLE KAREGI</div>
          <div style={{fontSize:13,color:"var(--ink)",lineHeight:1.8}}>
            ✅ <b>Tumhare paas webhook set ho gaya hai</b> — screenshot mein dikh raha hai<br/>
            ✅ Bot messages → tumhare Vercel URL → same AI backend<br/>
            ✅ Koi alag hosting ki zarurat NAHI<br/>
            ✅ Vercel 24/7 free mein active rehta hai
          </div>
        </div>

        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:12}}>BOT SETTINGS</div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>TOKEN (from Settings)</label>
            <div style={{background:"var(--bg3)",borderRadius:8,padding:"8px 12px",fontSize:12.5,color:"var(--ink)",fontFamily:"'JetBrains Mono',monospace"}}>
              {loadCfg().telegramToken?loadCfg().telegramToken.slice(0,12)+"...":"❌ Settings mein add karo"}
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>USER ID (from Settings)</label>
            <div style={{background:"var(--bg3)",borderRadius:8,padding:"8px 12px",fontSize:12.5,color:"var(--ink)"}}>
              {loadCfg().telegramOwnerId||"❌ Settings mein add karo"}
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>BACKEND URL (Vercel URL)</label>
            <input className="inp" value={cfg.backendUrl||""} onChange={e=>setCfg({...cfg,backendUrl:e.target.value})} placeholder="https://yourapp.vercel.app"/>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={testToken} className="btn-b" style={{fontSize:12,padding:"8px 12px"}}><I n="check" s={13}/>Test Token</button>
            <button onClick={()=>setWebhook()} disabled={loading} className="btn-b" style={{fontSize:12,padding:"8px 12px"}}>{loading?<Spin s={13}/>:<><I n="bot" s={13}/>Set Webhook</>}</button>

          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>BOT COMMANDS</div>

              <span style={{fontSize:12.5,color:"var(--mu)"}}>{d}</span>
            </div>
          ))}
        </div>

        {/* VPS option if needed */}
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>ALTERNATIVE: VPS HOSTING (optional)</div>

            • <a href="https://railway.app" target="_blank" style={{color:"var(--b)"}}>Railway.app</a> — $5 free credit/month<br/>

  );
}

function MemView({onBack}) {
  const [mems,setMems]=useState(()=>loadMem());
  const [addTxt,setAddTxt]=useState("");
  function del(id){const m=mems.filter(x=>x.id!==id);saveMem(m);setMems(m);}
  function addNew(){if(!addTxt.trim())return;addMem(addTxt.trim(),"manual");setMems(loadMem());setAddTxt("");}
  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div className="topbar"><button className="back" onClick={onBack}><I n="arrl" s={14} c="var(--g)"/> Home</button><span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"var(--ink)",flex:1}}>Memory</span><span className="pill pill-p"><I n="brain" s={10} c="var(--p)"/>{mems.length}</span></div>
      <div className="panel" style={{padding:14}}>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input className="inp" value={addTxt} onChange={e=>setAddTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addNew()} placeholder="Add memory…" style={{flex:1}}/>
          <button className="btn-g" onClick={addNew} style={{padding:"9px 13px"}}><I n="plus" s={14} c="#fff"/></button>
        </div>
        {mems.length===0&&<div style={{textAlign:"center",color:"var(--mu)",padding:40,fontSize:13}}>Chat mein <em>"yaad rakh..."</em> kaho!</div>}
        {[...mems].reverse().map(m=>(
          <div key={m.id} className="card" style={{padding:"12px 14px",marginBottom:9,display:"flex",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9.5,color:"var(--p)",fontWeight:700,letterSpacing:".8px",marginBottom:3}}>{(m.type||"fact").toUpperCase()}</div>
              <div style={{fontSize:13.5,color:"var(--ink)",lineHeight:1.5}}>{m.text}</div>
              <div style={{fontSize:10.5,color:"var(--mu)",marginTop:4}}>{new Date(m.ts||Date.now()).toLocaleDateString()}</div>
            </div>
            <button onClick={()=>del(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--mu)",padding:4,flexShrink:0}}><I n="trash" s={14}/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

            <div style={{fontSize:13.5,fontWeight:600,color:"var(--ink)",marginBottom:4,lineHeight:1.2}}>{t.l}</div>
            <div style={{fontSize:11.5,color:"var(--mu)",lineHeight:1.5,marginBottom:7}}>{t.d}</div>
            <span className={`pill ${t.id==="chat"&&cfg.apiKey?"pill-g":t.id==="chat"?"pill-r":t.id==="bot"&&cfg.telegramToken?"pill-o":t.id==="memory"?"pill-p":"pill-b"}`} style={{fontSize:9.5}}>{t.badge}</span>
          </div>
        ))}
      </div>

      {!cfg.apiKey&&(
        <div style={{background:"rgba(220,38,38,.06)",border:"1px solid rgba(220,38,38,.15)",borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--r)",marginBottom:7}}>API KEY FIX</div>
          <div style={{fontSize:13,color:"var(--ink)",lineHeight:1.9}}>
            1. Settings dabao<br/>
            2. API Key field mein: <code style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,background:"var(--bg3)",padding:"1px 5px",borderRadius:4}}>fe_oa_6c3f235d...</code><br/>
            3. <b>💾 Save All Settings</b> dabao<br/>
            4. Test Connection dabao → ✅
          </div>
        </div>
      )}

      <div className="card" style={{padding:14}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>LUMIS KYA SAMJHEGA</div>
        {[
          {t:"Email","d":"\"10 names email karo\" → generate + auto send"},
          {t:"Telegram","d":"\"Bot pe bhej do\" → Telegram pe send"},
          {t:"File","d":"\"Text file de do\" → download button aata hai"},
          {t:"Memory","d":"\"Yaad rakh...\" → permanently saved"},
          {t:"Image","d":"Photo upload → full AI analysis"},
        ].map(({t,d})=>(
          <div key={t} style={{display:"flex",gap:10,marginBottom:7}}>
            <span className="pill pill-g" style={{fontSize:10,flexShrink:0,alignSelf:"flex-start",marginTop:1}}>{t}</span>
            <span style={{fontSize:12,color:"var(--mu)",lineHeight:1.4}}>{d}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════
   ROOT APP
══════════════════════════ */
function App() {
  const [locked,setLocked]=useState(true);
  const [view,setView]=useState("home");
  const [sbOpen,setSbOpen]=useState(false);

  const nav=[
    {id:"home",i:"home",l:"Home"},
    {id:"research",i:"search",l:"Research"},
    {id:"chat",i:"chat",l:"Chat"},
    {id:"bot",i:"bot",l:"Bot"},
    {id:"settings",i:"set",l:"Settings"},
  ];

  function panel(){
    const ob={onBack:()=>setView("home")};
    switch(view){
      case "home": return <Home setView={setView}/>;
      case "research": return <Research {...ob}/>;
      case "chat": return <Chat {...ob}/>;
      case "bot": return <BotPanel {...ob}/>;
      case "memory": return <MemView {...ob}/>;
      case "settings": return <Settings {...ob} onLock={()=>setLocked(true)}/>;
      default: return <Home setView={setView}/>;
    }
  }

  if(locked) return <Lock onUnlock={()=>setLocked(false)}/>;

  return (
    <div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)",overflow:"hidden",fontFamily:"'Outfit',sans-serif",color:"var(--ink)"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
        <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(58,125,92,.16),transparent 70%)",top:-100,right:-60,filter:"blur(70px)",animation:"pulse 8s ease infinite"}}/>
        <div style={{position:"absolute",width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(37,99,235,.07),transparent 70%)",bottom:-80,left:-40,filter:"blur(70px)",animation:"pulse 10s ease infinite",animationDelay:"-4s"}}/>
      </div>

      {sbOpen&&<div className="ov" onClick={()=>setSbOpen(false)}/>}
      <aside className={`sb${sbOpen?" open":""}`}>
        <div style={{padding:"18px 16px 13px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:34,height:34,borderRadius:10,background:"var(--gs)",border:"1px solid rgba(58,125,92,.2)",display:"flex",alignItems:"center",justifyContent:"center"}}><I n="leaf" s={17} c="var(--g)"/></div>
            <div><div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,color:"var(--ink)",lineHeight:1.1}}>Lumis</div><div style={{fontSize:9.5,color:"var(--mu)",letterSpacing:".7px"}}>PERSONAL AI</div></div>
          </div>
          <button onClick={()=>setSbOpen(false)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--mu)",padding:6,borderRadius:8}}><I n="x" s={18}/></button>
        </div>
        <nav style={{flex:1,overflowY:"auto",padding:"8px 10px"}}>
          {[...nav,{id:"memory",i:"brain",l:"Memory"}].map(x=>(
            <div key={x.id} className={`ni${view===x.id?" on":""}`} onClick={()=>{setView(x.id);setSbOpen(false);}}><I n={x.i} s={15} c={view===x.id?"var(--g)":"var(--mu)"}/>{x.l}</div>
          ))}
        </nav>
        <div style={{padding:"12px 14px",borderTop:"1px solid var(--bd)"}}>
          <div style={{fontSize:12,color:"var(--mu)",marginBottom:6}}>👤 {OWNER.name}</div>
          <button onClick={()=>setLocked(true)} className="btn-o" style={{width:"100%",justifyContent:"center",fontSize:12,padding:"8px"}}><I n="lock" s={13}/>Lock</button>
        </div>
      </aside>

      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative",zIndex:1,minHeight:0}}>
        {view==="home"&&(
          <div className="topbar">
            <button onClick={()=>setSbOpen(true)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink)",padding:8,borderRadius:8,touchAction:"manipulation"}}><I n="menu" s={21}/></button>
            <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:"var(--ink)",flex:1}}>Lumis</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:7,height:7,borderRadius:99,background:"var(--g)"}}/><span style={{fontSize:11,color:"var(--mu)"}}>AI</span></div>
          </div>
        )}
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>
          {panel()}
        </div>
      </div>

      <div className="bnav" style={{position:"relative",zIndex:1}}>
        {nav.map(x=>(
          <div key={x.id} className={`bni${view===x.id?" on":""}`} onClick={()=>setView(x.id)}>
            <I n={x.i} s={20} c={view===x.id?"var(--g)":"var(--mu)"}/>
            <span>{x.l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
