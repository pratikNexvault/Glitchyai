html,body,#root{width:100%;height:100vh;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:#f0f4f1;color:#1a2e22;-webkit-font-smoothing:antialiased}
:root{

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes lockIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.fu{animation:fadeUp .35s ease both}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#1a2e22,#0d1f14);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;animation:lockIn .4s ease}
.topbar{display:flex;align-items:center;height:52px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0;gap:10px;backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.bnav{height:58px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:7px 14px;border-radius:12px;transition:all .15s;touch-action:manipulation;min-width:52px;user-select:none}
.bni.on{background:var(--gs)}.bni span{font-size:10px;font-weight:500;color:var(--mu)}.bni.on span{color:var(--g);font-weight:700}
.panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
.back{display:inline-flex;align-items:center;gap:5px;padding:7px 14px 7px 9px;background:var(--gs);border:1px solid rgba(58,125,92,.25);border-radius:99px;color:var(--g);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;touch-action:manipulation;font-family:'Outfit',sans-serif;flex-shrink:0}

.ov{position:fixed;inset:0;background:rgba(26,46,34,.5);z-index:199;animation:overlayIn .2s ease;backdrop-filter:blur(3px)}
.sb{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:200;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sb.open{transform:translateX(0)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--mu);transition:all .15s;border:1px solid transparent;touch-action:manipulation}
.ni:active{background:var(--gs)}.ni.on{background:var(--gs);color:var(--g);font-weight:600;border-color:rgba(58,125,92,.2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 2px 12px rgba(58,125,92,.06)}
.hc{transition:transform .15s;cursor:pointer;touch-action:manipulation}.hc:active{transform:scale(.97)}

.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(58,125,92,.1)}.inp::placeholder{color:var(--mu)}
.btn-g{background:var(--g);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;touch-action:manipulation}
.btn-g:active{transform:scale(.96)}.btn-g:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-b{background:var(--bs);color:var(--b);border:1px solid rgba(37,99,235,.25);border-radius:10px;padding:10px 18px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;touch-action:manipulation}
.btn-b:active{transform:scale(.96)}.btn-b:disabled{opacity:.4;cursor:not-allowed}

.dot-t{width:6px;height:6px;border-radius:99px;background:var(--g);display:inline-block;animation:pulse 1.2s ease infinite}
.cb{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;overflow-x:auto;line-height:1.65;white-space:pre-wrap;word-break:break-all;color:var(--ink)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;gap:3px}
.pill-g{background:var(--gs);color:var(--g);border:1px solid rgba(58,125,92,.2)}
.pill-b{background:var(--bs);color:var(--b);border:1px solid rgba(37,99,235,.2)}

const Spin = ({s=15,c="var(--g)"}) => <div style={{width:s,height:s,border:`2px solid rgba(58,125,92,.18)`,borderTop:`2px solid ${c}`,borderRadius:"50%",animation:"spin .7s linear infinite",flexShrink:0}}/>;

/* ══ MARKDOWN ══ */
function md(t) {
  if(!t) return "";
  return t
    .replace(/```email_action\n?([\s\S]*?)```/g,(_,c)=>{ try{ const d=JSON.parse(c.trim()); return `<div style="background:rgba(37,99,235,.07);border:1px solid rgba(37,99,235,.2);border-radius:10px;padding:12px;margin:8px 0"><div style="font-size:10px;font-weight:700;color:var(--b);letter-spacing:1px;margin-bottom:5px">📧 EMAIL SENT</div><div style="font-size:12.5px;color:var(--ink);line-height:1.6"><b>To:</b> ${d.to}<br/><b>Subject:</b> ${d.subject}</div></div>`; }catch{return "";} })
    .replace(/```tg_action\n?([\s\S]*?)```/g,(_,c)=>{ try{ const d=JSON.parse(c.trim()); return `<div style="background:rgba(0,136,204,.07);border:1px solid rgba(0,136,204,.2);border-radius:10px;padding:12px;margin:8px 0"><div style="font-size:10px;font-weight:700;color:#0088cc;letter-spacing:1px;margin-bottom:5px">📱 SENT TO TELEGRAM</div><div style="font-size:12.5px;color:var(--ink)">${d.msg?.slice(0,100)}</div></div>`; }catch{return "";} })
    .replace(/```file_action:([^\n]+)\n([\s\S]*?)```/g,(_,fname,content)=>{ const enc=encodeURIComponent(content); return `<div style="background:rgba(58,125,92,.06);border:1px solid rgba(58,125,92,.2);border-radius:10px;padding:12px;margin:8px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span style="font-size:10px;font-weight:700;color:var(--g)">📄 ${fname}</span><button onclick="window.__dl('${fname}','${enc}')" style="background:var(--g);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer">⬇ Download</button></div><pre style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);white-space:pre-wrap;max-height:80px;overflow:hidden">${content.replace(/</g,"&lt;").slice(0,150)}</pre></div>`; })
    .replace(/```mem_action\n?([\s\S]*?)```/g,(_,c)=>{ try{ const d=JSON.parse(c.trim()); addMem(d.text,d.type||"fact",d.imp||5); return `<div style="background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;color:var(--p)">🧠 <b>Remembered:</b> ${d.text}</div>`; }catch{return "";} })
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre class="cb" style="margin:8px 0">${c.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</pre>`)
    .replace(/`([^`]+)`/g,`<code style="background:var(--bg3);border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:.85em">$1</code>`)
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>")
    .replace(/^### (.+)$/gm,`<h3 style="font-size:15px;font-weight:600;color:var(--ink);margin:10px 0 4px">$1</h3>`)
    .replace(/^## (.+)$/gm,`<h2 style="font-size:17px;font-weight:700;color:var(--ink);margin:12px 0 5px">$1</h2>`)
    .replace(/^- (.+)$/gm,`<div style="display:flex;gap:7px;margin:3px 0"><span style="color:var(--g);font-weight:700;flex-shrink:0">•</span><span>$1</span></div>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,`<a href="$2" target="_blank" style="color:var(--b);text-decoration:none;border-bottom:1px solid rgba(37,99,235,.3)">$1</a>`)
    .replace(/\n\n/g,"<br/><br/>").replace(/\n/g,"<br/>");
}

/* ══ CALL AI — OpenClaude via CORS proxies ══ */
async function callAI(messages, imageB64, imageMime) {
  const cfg = loadCfg();
  const key = cfg.apiKey || "";
  const base = (cfg.apiBase || "https://cc.freemodel.dev").replace(/\/$/,"");
  const model = cfg.model || "claude-sonnet-4-6";

  if(!key) return "⚠️ **API key missing!**\n\nSettings → API Key mein apni key daalo (fe_oa_...)";

  // Build system prompt with memory
  const mem = loadMem();
  const memTxt = mem.length ? "\n\nMY MEMORY:\n"+mem.map(m=>`- [${m.type}] ${m.text}`).join("\n") : "";

  const sys = `You are Lumis — intelligent personal AI for ${OWNER.name}.

OWNER: ${OWNER.name} | Email: ${OWNER.email} | Send FROM: ${OWNER.from}

AUTONOMOUS ACTIONS (use when needed, no explicit instruction required):
Email → \`\`\`email_action\n{"to":"x@x.com","subject":"S","body":"B"}\`\`\`
Telegram → \`\`\`tg_action\n{"msg":"message"}\`\`\`
File → \`\`\`file_action:name.txt\ncontent\`\`\`
Memory → \`\`\`mem_action\n{"text":"what","type":"fact","imp":7}\`\`\`

EXAMPLES:
- "10 names email karo" → generate + email_action to ${OWNER.email}
- "Bot pe bhej do" → tg_action
- "Text file mein de do" → file_action
- "Yaad rakh..." → mem_action + confirm

EXPERTISE: Python, JS, TS, React, Next.js, FastAPI, Node.js, Telegram bots, APIs, DBs. 15+ years.
PERSONALITY: Warm, expert. Hindi+English mixed OK. Never say "I can't."${memTxt}`;

  const buildContent = (text,img,mime) => img
    ? [{type:"image",source:{type:"base64",media_type:mime||"image/jpeg",data:img}},{type:"text",text:text||"Analyze this."}]
    : text;

  const clean = [];
  for(const m of messages.map((m,i)=>({role:m.role==="system"?"user":m.role, content:i===messages.length-1&&imageB64?buildContent(m.content,imageB64,imageMime):m.content}))){
    if(m.role==="user"||m.role==="assistant"){
      if(!clean.length||m.role!==clean[clean.length-1].role) clean.push(m);
    }
  }

  const body = JSON.stringify({model,max_tokens:2048,system:sys,messages:clean});
  const hdrs = {"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};

  // Try 3 endpoints — direct first, then CORS proxies
  const urls = [
    `${base}/v1/messages`,
    `https://corsproxy.io/?${encodeURIComponent(base+"/v1/messages")}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(base+"/v1/messages")}`,
  ];

  for(const url of urls) {
    try {
      const res = await fetch(url,{method:"POST",headers:hdrs,body});
      if(!res.ok){
        const err=await res.json().catch(()=>({}));
        const msg=err.error?.message||res.statusText;
        if(res.status===401) return `⚠️ **Invalid API key (401)**\n\nSettings mein key check karo — \`fe_oa_\` se shuru honi chahiye`;
        if(res.status===404) return `⚠️ **Wrong URL (404)**\n\nBase URL: \`https://cc.freemodel.dev\`\n\n${msg}`;
        if(res.status>=500){continue;}
        return `⚠️ **Error ${res.status}:** ${msg}`;
      }
      const d=await res.json();
      const reply=d.content?.map(b=>b.text||"").join("")||"No response.";

      // Execute email/telegram actions
      executeActions(reply);
      return reply;
    }catch(e){
      if(url===urls[urls.length-1]) return `⚠️ **Connection failed**\n\nCheck:\n1. Base URL: \`https://cc.freemodel.dev\`\n2. API key correct?\n3. Internet working?\n\nError: ${e.message}`;
    }
  }
  return "⚠️ All connection attempts failed.";
}

/* ══ EXECUTE ACTIONS ══ */
async function executeActions(reply) {
  const cfg=loadCfg();

  // Email via EmailJS or direct Gmail API
  const emails=[...reply.matchAll(/```email_action\n?([\s\S]*?)```/g)];
  for(const m of emails){
    try{
      const d=JSON.parse(m[1].trim());
      // If backend URL set, use it
      if(cfg.backendUrl){
        await fetch(cfg.backendUrl+"/api/email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...d,from:OWNER.from,gmailPass:cfg.gmailPass})}).catch(()=>{});
      }
    }catch{}
  }

  // Telegram
  const tgs=[...reply.matchAll(/```tg_action\n?([\s\S]*?)```/g)];
  for(const m of tgs){
    try{
      const d=JSON.parse(m[1].trim());
      const token=cfg.telegramToken; const chatId=cfg.telegramOwnerId;
      if(token&&chatId){
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chatId,text:d.msg,parse_mode:"Markdown"})}).catch(()=>{});
      }
    }catch{}
  }
}

/* ══ WEB RESEARCH ══ */
async function doResearch(q){
  const res=[]; let ans="",abs="";
  try{
    const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`,{headers:{"User-Agent":"Lumis/2.0"}});
    const d=await r.json();
    ans=d.Answer||""; abs=d.Abstract||"";
    (d.RelatedTopics||[]).slice(0,5).forEach(t=>{if(t.Text&&t.FirstURL)res.push({title:t.Text.slice(0,80),url:t.FirstURL,snippet:t.Text,src:"DuckDuckGo"});});
    (d.Results||[]).slice(0,3).forEach(r=>{if(r.Text&&r.FirstURL)res.push({title:r.Text.slice(0,80),url:r.FirstURL,snippet:r.Text,src:"DuckDuckGo"});});
  }catch{}
  try{
    const w=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q.split(" ").slice(0,3).join("_"))}`,{headers:{"User-Agent":"Lumis/2.0"}});
    if(w.ok){const d=await w.json();if(d.extract?.length>50)res.unshift({title:d.title,url:d.content_urls?.desktop?.page||"#",snippet:d.extract.slice(0,300),src:"Wikipedia",thumb:d.thumbnail?.source});}
  }catch{}
  return {q,ans,abs,res};
}

      <div className="topbar"><button className="back" onClick={onBack}><I n="arrl" s={14} c="var(--g)"/> Home</button><span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"var(--ink)",flex:1}}>Telegram Bot</span></div>
      <div className="panel" style={{padding:14}}>

        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>BOT TOKEN</div>
          <div style={{marginBottom:8}}><input className="inp" type="password" value={cfg.telegramToken||""} onChange={e=>setCfg({...cfg,telegramToken:e.target.value})} placeholder="From @BotFather — 1234:ABC..."/></div>
          <div style={{marginBottom:10}}><label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>YOUR TELEGRAM USER ID</label><input className="inp" value={cfg.telegramOwnerId||""} onChange={e=>setCfg({...cfg,telegramOwnerId:e.target.value})} placeholder="Get from @userinfobot"/></div>
          <div style={{marginBottom:12}}><label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>BACKEND URL (Vercel app URL)</label><input className="inp" value={cfg.backendUrl||""} onChange={e=>setCfg({...cfg,backendUrl:e.target.value})} placeholder="https://yourapp.vercel.app"/><div style={{fontSize:11,color:"var(--mu)",marginTop:4}}>This connects Telegram webhook to your AI backend</div></div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={save} className="btn-g" style={{flex:1,justifyContent:"center"}}>{saved?<><I n="check" s={14} c="#fff"/>Saved!</>:<><I n="key" s={14} c="#fff"/>Save</>}</button>
            <button onClick={testToken} className="btn-b" disabled={!cfg.telegramToken} style={{padding:"9px 13px"}}><I n="check" s={13}/>Test</button>
            <button onClick={setWebhook} className="btn-b" disabled={loading||!cfg.telegramToken} style={{flex:1,justifyContent:"center"}}>{loading?<Spin s={14}/>:<><I n="bot" s={13}/>Webhook</>}</button>
          </div>
          {wRes&&<div style={{marginTop:10,padding:"10px 14px",background:wRes.startsWith("✅")?"var(--gs)":wRes.startsWith("⚠️")?"var(--os)":"rgba(220,38,38,.07)",border:`1px solid ${wRes.startsWith("✅")?"rgba(58,125,92,.2)":wRes.startsWith("⚠️")?"rgba(196,135,74,.2)":"rgba(220,38,38,.2)"}`,borderRadius:10,fontSize:12,color:wRes.startsWith("✅")?"var(--g)":wRes.startsWith("⚠️")?"var(--o)":"var(--r)",whiteSpace:"pre-wrap",wordBreak:"break-all"}}>{wRes}</div>}
        </div>

        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--g)",letterSpacing:"1px",marginBottom:10}}>STEP BY STEP</div>
          {[
            {n:"1",t:"BotFather se token lo",d:"Telegram → @BotFather → /newbot → naam do → token copy karo"},
            {n:"2",t:"Token save karo",d:"Upar paste karo → Save dabao"},
            {n:"3",t:"Apna ID lo",d:"Telegram → @userinfobot message karo → ID copy karo"},
            {n:"4",t:"Vercel pe deploy karo",d:"lumis-v2.zip extract → GitHub → Vercel import → env vars daalo"},
            {n:"5",t:"Webhook set karo",d:"Vercel URL upar daalo → 'Webhook' button dabao → Done!"},
            {n:"6",t:"Test karo",d:"Bot ko /start message karo → Lumis AI se reply aana chahiye"},
          ].map(s=>(
            <div key={s.n} style={{display:"flex",gap:12,marginBottom:10}}>
              <div style={{width:24,height:24,borderRadius:99,background:"var(--gs)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"var(--g)",flexShrink:0}}>{s.n}</div>
              <div><div style={{fontSize:13.5,fontWeight:600,color:"var(--ink)",marginBottom:1}}>{s.t}</div><div style={{fontSize:12.5,color:"var(--mu)",lineHeight:1.5}}>{s.d}</div></div>
            </div>
          ))}
        </div>

        <div className="card" style={{padding:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>BOT COMMANDS</div>
          {["/start — Welcome","/clear — Conversation reset","/status — System check","Kuch bhi likho — AI reply dega"].map(c=><div key={c} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,background:"var(--bg3)",borderRadius:8,padding:"7px 10px",marginBottom:6,color:"var(--ink)"}}>{c}</div>)}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════
   SETTINGS
══════════════════════════ */
function Settings({onBack,onLock}){
  const [cfg,setCfg]=useState(()=>loadCfg());
  const [saved,setSaved]=useState(false);
  const [showKey,setShowKey]=useState(false);
  const [newPw,setNewPw]=useState(""); const [cPw,setCPw]=useState(""); const [msg,setMsg]=useState("");

  function save(){ saveCfg(cfg); setSaved(true); setTimeout(()=>setSaved(false),2000); }

  function changePw(){
    if(newPw.length<4){setMsg("Min 4 chars");return;}
    if(newPw!==cPw){setMsg("Don't match");return;}
    setPwStore(newPw); setMsg("✓ Changed!"); setNewPw(""); setCPw("");
    setTimeout(()=>setMsg(""),2500);
  }

  async function testAPI(){
    if(!cfg.apiKey){setMsg("Key daalo pehle");return;}
    setMsg("Testing…");
    const r=await callAI([{role:"user",content:"Reply: 'Connected!'"}],null,null);
    setMsg(r.includes("⚠️")?r.slice(0,100):"✓ "+r.slice(0,60));
    setTimeout(()=>setMsg(""),5000);
  }

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div className="topbar"><button className="back" onClick={onBack}><I n="arrl" s={14} c="var(--g)"/> Home</button><span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"var(--ink)",flex:1}}>Settings</span><button onClick={onLock} className="btn-o" style={{fontSize:12,padding:"7px 11px"}}><I n="lock" s={13}/>Lock</button></div>
      <div className="panel" style={{padding:14}}>

        <div style={{background:"rgba(37,99,235,.05)",border:"1px solid rgba(37,99,235,.15)",borderRadius:12,padding:14,marginBottom:14,fontSize:13,color:"var(--ink)",lineHeight:1.7}}>
          🔒 <strong>Safe hai!</strong> API key sirf tumhare browser mein save hoti hai (localStorage). Source code mein nahi. Koi bhi source code dekhega toh sirf empty fields milenge.
        </div>

        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--g)",letterSpacing:"1px",marginBottom:12}}>🤖 OPENCLAUDE API</div>
          <div style={{marginBottom:8}}><label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>BASE URL</label><input className="inp" value={cfg.apiBase||"https://cc.freemodel.dev"} onChange={e=>setCfg({...cfg,apiBase:e.target.value})} placeholder="https://cc.freemodel.dev"/></div>
          <div style={{marginBottom:8}}>
            <label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>API KEY</label>
            <div style={{position:"relative"}}>
              <input className="inp" type={showKey?"text":"password"} value={cfg.apiKey||""} onChange={e=>setCfg({...cfg,apiKey:e.target.value})} placeholder="fe_oa_..." style={{paddingRight:40}}/>
              <button onClick={()=>setShowKey(!showKey)} style={{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",padding:4}}><I n={showKey?"eyeoff":"eye"} s={15} c="var(--mu)"/></button>
            </div>
            {cfg.apiKey&&<div style={{fontSize:11,color:"var(--g)",marginTop:3}}>✓ {cfg.apiKey.slice(0,14)}...</div>}
          </div>
          <div style={{marginBottom:12}}><label style={{fontSize:12,color:"var(--mu)",display:"block",marginBottom:4}}>MODEL</label>
            <select className="inp" value={cfg.model||"claude-sonnet-4-6"} onChange={e=>setCfg({...cfg,model:e.target.value})} style={{cursor:"pointer"}}>
              <option value="claude-sonnet-4-6">claude-sonnet-4-6 (Best)</option>
              <option value="claude-opus-4-6">claude-opus-4-6 (Powerful)</option>
              <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001 (Fast)</option>
            </select>
          </div>
          {msg&&<div style={{fontSize:12.5,color:msg.startsWith("✓")?"var(--g)":msg==="Testing…"?"var(--b)":"var(--r)",marginBottom:10,padding:"8px 12px",background:msg.startsWith("✓")?"var(--gs)":msg==="Testing…"?"var(--bs)":"rgba(220,38,38,.07)",borderRadius:8,lineHeight:1.5}}>{msg}</div>}
          <button onClick={testAPI} className="btn-b" style={{fontSize:13,padding:"8px 14px"}}><I n="zap" s={13}/>Test Connection</button>
        </div>

        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--p)",letterSpacing:"1px",marginBottom:12}}>🔒 CHANGE PASSWORD</div>
          <div style={{marginBottom:8}}><input className="inp" type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="New password"/></div>
          <div style={{marginBottom:12}}><input className="inp" type="password" value={cPw} onChange={e=>setCPw(e.target.value)} placeholder="Confirm" onKeyDown={e=>e.key==="Enter"&&changePw()}/></div>
          {msg&&<div style={{fontSize:12.5,color:msg.startsWith("✓")?"var(--g)":"var(--r)",marginBottom:8}}>{msg}</div>}
          <button onClick={changePw} className="btn-b" style={{fontSize:13,padding:"8px 14px"}}><I n="lock" s={13}/>Change</button>
        </div>

        <button onClick={save} className="btn-g" style={{width:"100%",justifyContent:"center",padding:"13px",fontSize:15,marginBottom:8}}>
          {saved?<><I n="check" s={14} c="#fff"/>Saved!</>:"💾 Save All Settings"}
        </button>
        <div style={{fontSize:12,color:"var(--mu)",textAlign:"center",marginBottom:24}}>Settings browser mein save hoti hain — sirf tumhare device pe</div>
      </div>
    </div>
  );
}

/* ══════════════════════════
   MEMORY
══════════════════════════ */
function MemView({onBack}){
  const [mems,setMems]=useState(()=>loadMem());
  const [add,setAdd]=useState("");
  function del(id){ const m=mems.filter(x=>x.id!==id); saveMem(m); setMems(m); }
  function addNew(){ if(!add.trim()) return; addMem(add.trim(),"manual"); setMems(loadMem()); setAdd(""); }
  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div className="topbar"><button className="back" onClick={onBack}><I n="arrl" s={14} c="var(--g)"/> Home</button><span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"var(--ink)",flex:1}}>Memory</span><span className="pill pill-p"><I n="brain" s={10} c="var(--p)"/>{mems.length}</span></div>
      <div className="panel" style={{padding:14}}>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input className="inp" value={add} onChange={e=>setAdd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addNew()} placeholder="Add memory…" style={{flex:1}}/>
          <button className="btn-g" onClick={addNew} style={{padding:"9px 13px"}}><I n="plus" s={14} c="#fff"/></button>
        </div>
        {mems.length===0&&<div style={{textAlign:"center",color:"var(--mu)",padding:40,fontSize:13}}>Chat mein <em>"yaad rakh..."</em> kaho!</div>}
        {[...mems].reverse().map(m=>(
          <div key={m.id} className="card" style={{padding:"12px 14px",marginBottom:9,display:"flex",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9.5,color:"var(--p)",fontWeight:700,letterSpacing:".8px",marginBottom:3}}>{(m.type||"fact").toUpperCase()}</div>
              <div style={{fontSize:13.5,color:"var(--ink)",lineHeight:1.5}}>{m.text}</div>
              <div style={{fontSize:10.5,color:"var(--mu)",marginTop:4}}>{new Date(m.ts).toLocaleDateString()}</div>
            </div>
            <button onClick={()=>del(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--mu)",padding:4,flexShrink:0}}><I n="trash" s={14}/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════
   HOME
══════════════════════════ */
function Home({setView}){
  const cfg=loadCfg(); const mem=loadMem();
  const tiles=[
    {id:"research",i:"search",l:"Research",d:"Wikipedia + DuckDuckGo + AI",c:"var(--b)",bg:"var(--bs)",badge:"Free"},
    {id:"chat",i:"chat",l:"Lumis Chat",d:"AI · images · email · files",c:"var(--g)",bg:"var(--gs)",badge:cfg.apiKey?"Connected":"Setup needed"},
    {id:"bot",i:"bot",l:"Telegram Bot",d:"Same AI on Telegram",c:"var(--o)",bg:"var(--os)",badge:"n8n optional"},
    {id:"memory",i:"brain",l:"Memory",d:`${mem.length} items remembered`,c:"var(--p)",bg:"var(--ps)",badge:`${mem.length} items`},
  ];
  return(
    <div className="panel" style={{padding:"18px 16px"}}>
      <div style={{marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
          <div style={{width:42,height:42,borderRadius:13,background:"var(--gs)",border:"1px solid rgba(58,125,92,.2)",display:"flex",alignItems:"center",justifyContent:"center"}}><I n="leaf" s={21} c="var(--g)"/></div>
          <div><div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:30,fontWeight:400,color:"var(--ink)",lineHeight:1}}>Lumis</div><div style={{fontSize:11,color:"var(--mu)"}}>Personal AI · {OWNER.name}</div></div>
        </div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          <span className={`pill ${cfg.apiKey?"pill-g":"pill-r"}`}><span style={{width:5,height:5,borderRadius:99,background:cfg.apiKey?"var(--g)":"var(--r)",display:"inline-block"}}/>{cfg.apiKey?"AI Connected":"API Key Needed"}</span>
          <span className="pill pill-b"><I n="globe" s={9}/>Research Ready</span>
          {mem.length>0&&<span className="pill pill-p"><I n="brain" s={9} c="var(--p)"/>{mem.length} Memories</span>}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:18}}>
        {tiles.map((t,i)=>(
          <div key={t.id} className="card hc fu" onClick={()=>setView(t.id)} style={{padding:15,animationDelay:`${i*.06}s`}}>
            <div style={{width:36,height:36,borderRadius:10,background:t.bg,border:`1px solid ${t.c}22`,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}><I n={t.i} s={16} c={t.c}/></div>
            <div style={{fontSize:13.5,fontWeight:600,color:"var(--ink)",marginBottom:4,lineHeight:1.2}}>{t.l}</div>
            <div style={{fontSize:11.5,color:"var(--mu)",lineHeight:1.5,marginBottom:7}}>{t.d}</div>
            <span className={`pill ${t.id==="chat"&&cfg.apiKey?"pill-g":t.id==="chat"?"pill-r":t.id==="bot"?"pill-o":t.id==="memory"?"pill-p":"pill-b"}`} style={{fontSize:9.5}}>{t.badge}</span>
          </div>
        ))}
      </div>

      {!cfg.apiKey&&(
        <div style={{background:"rgba(220,38,38,.06)",border:"1px solid rgba(220,38,38,.15)",borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--r)",marginBottom:7,letterSpacing:".5px"}}>SETUP (2 min)</div>
          <div style={{fontSize:13,color:"var(--ink)",lineHeight:1.9}}>
            1. Settings dabao<br/>
            2. Base URL: <code style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,background:"var(--bg3)",padding:"1px 5px",borderRadius:4}}>https://cc.freemodel.dev</code><br/>
            3. API Key: <code style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,background:"var(--bg3)",padding:"1px 5px",borderRadius:4}}>fe_oa_6c3f235d...</code><br/>
            4. Test Connection dabao → ✅
          </div>
        </div>
      )}

      <div className="card" style={{padding:14}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",letterSpacing:"1px",marginBottom:10}}>LUMIS KYA SAMJHEGA</div>
        {[
          {t:"Email","d":"\"Names email karo\" → generate + send auto"},
          {t:"Telegram","d":"\"Bot pe bhej do\" → Telegram pe send"},
          {t:"File","d":"\"Text file de do\" → download button"},
          {t:"Memory","d":"\"Yaad rakh...\" → permanently saved"},
          {t:"Image","d":"Photo upload karo → full analysis"},
          {t:"Code","d":"Any language, production-ready"},
        ].map(({t,d})=>(
          <div key={t} style={{display:"flex",gap:10,marginBottom:7}}>
            <span className="pill pill-g" style={{fontSize:10,flexShrink:0,alignSelf:"flex-start",marginTop:1}}>{t}</span>
            <span style={{fontSize:12,color:"var(--mu)",lineHeight:1.4}}>{d}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════
   ROOT APP
══════════════════════════ */
function App(){
  const [locked,setLocked]=useState(true);
  const [view,setView]=useState("home");
  const [sbOpen,setSbOpen]=useState(false);

  const nav=[
    {id:"home",i:"home",l:"Home"},
    {id:"research",i:"search",l:"Research"},
    {id:"chat",i:"chat",l:"Chat"},
    {id:"bot",i:"bot",l:"Bot"},
    {id:"settings",i:"set",l:"Settings"},
  ];

  function panel(){
    const ob={onBack:()=>setView("home")};
    switch(view){
      case "home": return <Home setView={setView}/>;
      case "research": return <Research {...ob}/>;
      case "chat": return <Chat {...ob}/>;
      case "bot": return <BotSetup {...ob}/>;
      case "memory": return <MemView {...ob}/>;
      case "settings": return <Settings {...ob} onLock={()=>setLocked(true)}/>;
      default: return <Home setView={setView}/>;
    }
  }

  if(locked) return <Lock onUnlock={()=>setLocked(false)}/>;

  return(
    <div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)",overflow:"hidden",fontFamily:"'Outfit',sans-serif",color:"var(--ink)"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
        <div style={{position:"absolute",width:360,height:360,borderRadius:"50%",background:"radial-gradient(circle,rgba(58,125,92,.16),transparent 70%)",top:-100,right:-60,filter:"blur(70px)",animation:"pulse 8s ease infinite"}}/>
        <div style={{position:"absolute",width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(37,99,235,.07),transparent 70%)",bottom:-80,left:-40,filter:"blur(70px)",animation:"pulse 10s ease infinite",animationDelay:"-4s"}}/>
      </div>

      {sbOpen&&<div className="ov" onClick={()=>setSbOpen(false)}/>}
      <aside className={`sb${sbOpen?" open":""}`}>
        <div style={{padding:"18px 16px 13px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:34,height:34,borderRadius:10,background:"var(--gs)",border:"1px solid rgba(58,125,92,.2)",display:"flex",alignItems:"center",justifyContent:"center"}}><I n="leaf" s={17} c="var(--g)"/></div>
            <div><div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,color:"var(--ink)",lineHeight:1.1}}>Lumis</div><div style={{fontSize:9.5,color:"var(--mu)",letterSpacing:".7px"}}>PERSONAL AI</div></div>
          </div>
          <button onClick={()=>setSbOpen(false)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--mu)",padding:6,borderRadius:8}}><I n="x" s={18}/></button>
        </div>
        <nav style={{flex:1,overflowY:"auto",padding:"8px 10px"}}>
          {[...nav,{id:"memory",i:"brain",l:"Memory"}].map(x=>(
            <div key={x.id} className={`ni${view===x.id?" on":""}`} onClick={()=>{setView(x.id);setSbOpen(false);}}><I n={x.i} s={15} c={view===x.id?"var(--g)":"var(--mu)"}/>{x.l}</div>
          ))}
        </nav>
        <div style={{padding:"12px 14px",borderTop:"1px solid var(--bd)"}}>
          <div style={{fontSize:12,color:"var(--mu)",marginBottom:6}}>👤 {OWNER.name}</div>
          <button onClick={()=>setLocked(true)} className="btn-o" style={{width:"100%",justifyContent:"center",fontSize:12,padding:"8px"}}><I n="lock" s={13}/>Lock</button>
        </div>
      </aside>

      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative",zIndex:1,minHeight:0}}>
        {view==="home"&&(
          <div className="topbar">
            <button onClick={()=>setSbOpen(true)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink)",padding:8,borderRadius:8,touchAction:"manipulation"}}><I n="menu" s={21}/></button>
            <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:"var(--ink)",flex:1}}>Lumis</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:7,height:7,borderRadius:99,background:"var(--g)"}}/><span style={{fontSize:11,color:"var(--mu)"}}>AI</span></div>
          </div>
        )}
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>
          {panel()}
        </div>
      </div>

      <div className="bnav" style={{position:"relative",zIndex:1}}>
        {nav.map(x=>(
          <div key={x.id} className={`bni${view===x.id?" on":""}`} onClick={()=>setView(x.id)}>
            <I n={x.i} s={20} c={view===x.id?"var(--g)":"var(--mu)"}/>
            <span>{x.l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
